version: "3.8"

services:
  hf-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hf-api
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # 2核CPU，ONNX_INTRA_THREADS=2 最优；1核建议设为1
      - ONNX_INTRA_THREADS=2
      - ONNX_INTER_THREADS=1
      - OMP_NUM_THREADS=2
      - OPENCV_FOR_THREADS_NUM=2
    deploy:
      resources:
        limits:
          memory: 4G
