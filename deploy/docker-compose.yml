version: "3.8"

services:
  hf-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hf-api
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      # ONNX线程数：默认自动检测；2核CPU建议设为2，1核建议设为1
      # 注释掉以下两行让ONNX自动检测
      # - ONNX_INTRA_THREADS=2
      # - ONNX_INTER_THREADS=1
    deploy:
      resources:
        limits:
          memory: 4G
