version: "3.8"

services:
  hf-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hf-api
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - WORKERS=1
      - ONNX_INTRA_THREADS=4
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]