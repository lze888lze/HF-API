version: "3.8"

services:
  hf-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: hf-api
    restart: unless-stopped
    ports:
      - "7860:7860"
    env_file:
      - .env
    # 如需调整ONNX线程数，在 .env 文件中添加：
    # ONNX_INTRA_THREADS=1
    # ONNX_INTER_THREADS=1
    deploy:
      resources:
        limits:
          memory: 4G
